<div class="ndt-empty-state" role="status">
    {% if icon %}<div class="ndt-empty-state__icon" aria-hidden="true">{{ icon }}</div>{% endif %}
    <h2 class="ndt-empty-state__title">{{ title }}</h2>
    {% if description %}<p class="ndt-empty-state__description">{{ description }}</p>{% endif %}
    {% if action_url and action_label %}
    <div class="ndt-empty-state__action">
        <a class="ndt-button ndt-button--secondary" href="{{ action_url }}">{{ action_label }}</a>
    </div>
    {% endif %}
</div>
